pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.architectury.dev/"
        }
        maven {
            url = "https://maven.minecraftforge.net/"
            content{
                excludeGroupByRegex "org\\.eclipse\\.?.*"
            }
        }
    }
}

rootProject.name = "NoEmotecraft"

include "emotesAPI"

include "executor"
include "emotesServer"
include "emotesAssets"

include "minecraft"
include "minecraft:archCommon"
include "minecraft:fabric"

include "bukkit"
